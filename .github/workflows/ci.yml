name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test cube core and workflow
        env:
          TWISTTUTOR_SOLVER_CASES: 1000
        run: swift test -c release --package-path Packages/TwistTutorKit --enable-code-coverage
      - name: Verify bundled solver tables are reproducible
        run: |
          swift run -c release --package-path Packages/TwistTutorKit SolverTools generate /tmp/TwoPhaseTables.bin
          cmp Packages/TwistTutorKit/Sources/CubeSolver/Resources/TwoPhaseTables.bin /tmp/TwoPhaseTables.bin
      - name: Build iOS app for simulator
        run: >-
          xcodebuild -project TwistTutor.xcodeproj -scheme TwistTutor
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
