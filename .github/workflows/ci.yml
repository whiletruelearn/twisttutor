name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test cube core and workflow
        run: swift test --package-path Packages/TwistTutorKit --enable-code-coverage
      - name: Build iOS app for simulator
        run: >-
          xcodebuild -project TwistTutor.xcodeproj -scheme TwistTutor
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
